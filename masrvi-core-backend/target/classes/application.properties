spring.application.name=masrvi-core-backend
server.port=8080

# Configuration Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/masrvidb
spring.datasource.username=postgres
spring.datasource.password=zenvour
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Création automatique des tables (utile en développement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#url du service RAG
rag.engine.url=http://localhost:8000

#pour que les tables soient mises à jour sans perte de données
spring.jpa.hibernate.ddl-auto=update

#URL du frontend
masrvi.frontend.url=http://localhost:4200

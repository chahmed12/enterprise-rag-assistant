<aside class="sidebar">
  <!-- Logo / Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="brand-name">MASRVI</span>
  </div>

  <!-- New Chat Button -->
  <button class="new-chat-btn" (click)="onNewChat()" id="new-chat-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    Nouvelle discussion
  </button>

  <!-- Session History -->
  <div class="sessions-header">
    <span>Historique</span>
  </div>
  <nav class="sessions-list">
    @for (session of sessions(); track session.id) {
      <button
        class="session-item"
        [class.active]="activeSessionId() === session.id"
        (click)="onSessionClick(session.id)"
        [id]="'session-' + session.id">
        <div class="session-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="session-info">
          <span class="session-title">{{ session.title }}</span>
          <span class="session-date">{{ session.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      </button>
    }
  </nav>
</aside>
